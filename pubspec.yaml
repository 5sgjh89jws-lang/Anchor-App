name: anchor
description: "Anchor - Stay Grounded"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Fraunces
      fonts:
        - asset: fonts/Fraunces-VariableFont_SOFT,WONK,opsz,wght.ttf
          weight: 400
        - asset: fonts/Fraunces-VariableFont_SOFT,WONK,opsz,wght.ttf
          weight: 600
        - asset: fonts/Fraunces-Italic-VariableFont_SOFT,WONK,opsz,wght.ttf
          weight: 400
          style: italic

    - family: DM Sans
      fonts:
        - asset: fonts/DMSans-VariableFont_opsz,wght.ttf
          weight: 400
        - asset: fonts/DMSans-VariableFont_opsz,wght.ttf
          weight: 500
        - asset: fonts/DMSans-VariableFont_opsz,wght.ttf
          weight: 600
        - asset: fonts/DMSans-Italic-VariableFont_opsz,wght.ttf
          weight: 400
          style: italic